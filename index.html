<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ينبوع الرجاء</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="35-apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ينبوع الرجاء">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f8f4e8">
<style>
:root{--cream:#f8f4e8;--card:#fffdf6;--line:#d9c391;--navy:#1d3f66;--gold:#c9a24a;--ink:#4a3410;--soft:#7a6a4a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,"Geeza Pro","Noto Naskh Arabic",Tahoma,sans-serif}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.banner{position:sticky;top:0;z-index:5;height:calc(170px + env(safe-area-inset-top));background:#000 url(34-banner.jpg) 30% center/cover;border-radius:0 0 34px 34px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.banner:before{content:"";position:absolute;inset:0;background:linear-gradient(#0000 15%,#000b 62%,#000e 100%)}
.banner h1{position:relative;margin:0 0 12px;color:#fff;font-size:34px;font-weight:800;text-shadow:0 2px 4px #000,0 4px 16px #000}
.back{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;z-index:2;color:#fff;font-size:34px;text-decoration:none;text-shadow:0 2px 6px #000;padding:4px 10px}
.logo{display:block;width:78%;max-width:340px;margin:12px auto 0}
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 10px;padding:18px 18px 0}
.s{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:800;font-size:17px;text-align:center}
.s .c,.t .c{width:74px;height:74px;border-radius:50%;background:var(--navy);border:3px solid var(--gold);display:flex;align-items:center;justify-content:center}
svg{stroke:#fff6dc;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;margin:14px 16px 0;background:#efe6cc;border-radius:28px;padding:5px}
.tabs a{flex:1;text-align:center;padding:10px;border-radius:24px;font-weight:700;font-size:18px;color:#6b5a3a;text-decoration:none}
.tabs a.on{background:var(--navy);color:#fff6dc}
.vt{display:block;margin:12px 14px 0 auto;background:var(--navy);color:#fff;border:0;border-radius:14px;padding:8px 16px;font-size:15px;font-weight:700;font-family:inherit}
.books.list,.chs.list{grid-template-columns:1fr}.books.list .t{flex-direction:row;justify-content:flex-start;gap:14px;padding:10px 16px}.books.list .t i{margin-inline-start:auto}.chs.list a{padding:12px 0}
.books{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 14px 0}
.t{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--ink);box-shadow:0 4px 0 #d9c39166}
.t .c{width:46px;height:46px}.t .c svg{width:26px;height:26px}
.t b{font-size:16px;line-height:1.25;min-height:40px;display:flex;align-items:center;text-align:center}
.t i{font-style:normal;font-size:13px;color:var(--soft)}
.chs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:16px}
.chs a{background:var(--card);border:2px solid var(--line);border-radius:16px;text-align:center;padding:14px 0;font-size:20px;font-weight:700;color:var(--ink);text-decoration:none}
.read{font-weight:var(--fw,400);padding:16px 20px 8px;font-size:var(--fs,24px);line-height:2.1}
.read h3{color:var(--navy);font-size:.8em;margin:18px 0 4px}.read p{margin:0 0 6px}.read sup{font-size:.55em;color:var(--gold);font-weight:800;margin-left:4px}
.ctl{display:flex;gap:10px;justify-content:center;padding:6px 16px}
.ctl a,.ctl button{background:var(--navy);color:#fff6dc;border:0;border-radius:22px;padding:10px 18px;font-size:17px;font-weight:700;text-decoration:none;font-family:inherit}
.credit{margin:18px 20px 0;font-size:13px;color:var(--soft);text-align:center;line-height:1.7}
.soon{margin:40px 24px;text-align:center;font-size:22px;line-height:1.9;color:var(--soft)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:9;background:var(--card);border-top:2px solid #e0d4b0;display:flex;justify-content:center;padding:8px 0 calc(10px + env(safe-area-inset-bottom))}
nav div{display:flex;width:100%;max-width:560px;justify-content:space-around}
nav a{text-align:center;text-decoration:none;color:#8a8470;font-weight:600;font-size:14px;min-width:90px}
nav a.on{color:var(--navy);font-weight:800}
nav a span{display:block;font-size:26px;line-height:1.2}
nav a span{display:flex;justify-content:center}nav a svg{display:block}nav a:before{display:none!important}nav a:not(.on) span svg{opacity:.62}nav a.on span svg{stroke-width:2.1}nav a.on span svg [fill-opacity]{fill-opacity:.9}nav a.on:after{content:"";display:block;width:22px;height:4px;margin:2px auto 0;background:var(--gold);border-radius:3px}</style><link rel="stylesheet" href="settings.css"><script src="settings.js"></script></head><body><div id="app"></div>

<script src="app.js"></script></body></html>
